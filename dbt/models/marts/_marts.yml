version: 2

models:
  - name: fato_internacao
    description: Uma linha por internação (AIH principal) aprovada no SIH/SUS
    columns:
      - name: n_aih
        data_tests: [unique, not_null]
      - name: competencia
        data_tests: [not_null]
      - name: cnes
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_estabelecimento'), field: cnes}
      - name: cod_procedimento
        data_tests:
          - relationships:
              arguments: {to: ref('dim_procedimento'), field: cod_procedimento}
      - name: cod_cid
        data_tests:
          - relationships:
              arguments: {to: ref('dim_diagnostico'), field: cod_cid}
              config: {severity: warn}
      - name: cod_municipio_residencia
        data_tests:
          - relationships:
              arguments: {to: ref('dim_municipio'), field: cod_municipio}
      - name: tipo_entrada
        data_tests:
          - accepted_values:
              arguments: {values: ['Eletiva', 'Urgência']}
      - name: especialidade_leito
        data_tests: [not_null]
      - name: dt_internacao
        data_tests:
          - relationships:
              arguments: {to: ref('dim_tempo'), field: data}

  - name: dim_estabelecimento
    columns:
      - name: cnes
        data_tests: [unique, not_null]
  - name: dim_procedimento
    columns:
      - name: cod_procedimento
        data_tests: [unique, not_null]
  - name: dim_diagnostico
    columns:
      - name: cod_cid
        data_tests: [unique, not_null]
  - name: dim_municipio
    columns:
      - name: cod_municipio
        data_tests: [unique, not_null]
  - name: dim_tempo
    columns:
      - name: data
        data_tests: [unique, not_null]
  - name: mart_indicadores_mensais
    columns:
      - name: internacoes
        data_tests: [not_null]
